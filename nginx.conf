server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/auth.inc;
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # 公司渠道由服务端签名，走站点 Basic Auth，不要把密钥下发到浏览器。
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 浏览器无法直连腾讯云 API（无 CORS），本地/容器部署时由 nginx 转发点播签名请求。
    # 该路径使用 TC3 Authorization，不能再套一层 HTTP Basic。仅个人渠道仍走这里。
    location = /tencent-vod {
        auth_basic off;
        proxy_pass https://vod.tencentcloudapi.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host vod.tencentcloudapi.com;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
