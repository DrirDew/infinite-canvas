services:
  server:
    image: infinite-canvas-server:local
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TENCENT_VOD_SECRET_ID: ${TENCENT_VOD_SECRET_ID:-}
      TENCENT_VOD_SECRET_KEY: ${TENCENT_VOD_SECRET_KEY:-}
      TENCENT_VOD_SUB_APP_ID: ${TENCENT_VOD_SUB_APP_ID:-}
    volumes:
      - ./data:/app/data
  client:
    image: infinite-canvas-client:local
    build:
      context: .
      dockerfile: Dockerfile
      target: client
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - server
    # 统计分析从项目根目录 .env 读取，模板见 .env.example。
    environment:
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
