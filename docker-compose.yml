services:
  api:
    image: infinite-canvas-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      TENCENT_VOD_SECRET_ID: ${TENCENT_VOD_SECRET_ID:-}
      TENCENT_VOD_SECRET_KEY: ${TENCENT_VOD_SECRET_KEY:-}
      TENCENT_VOD_SUB_APP_ID: ${TENCENT_VOD_SUB_APP_ID:-}
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api
    # 访问保护与统计分析从项目根目录 .env 读取，模板见 .env.example。AUTH_PASSWORD 为空则不启用访问保护。
    environment:
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      ANALYTICS_GA4_ID: ${ANALYTICS_GA4_ID:-}
      ANALYTICS_BAIDU_ID: ${ANALYTICS_BAIDU_ID:-}
