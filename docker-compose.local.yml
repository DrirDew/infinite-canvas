services:
  api:
    image: infinite-canvas-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    # 应用登录与公司渠道从项目根目录 .env 读取。ADMIN_PASSWORD 只在空库时创建管理员。
    environment:
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TENCENT_VOD_SECRET_ID: ${TENCENT_VOD_SECRET_ID:-}
      TENCENT_VOD_SECRET_KEY: ${TENCENT_VOD_SECRET_KEY:-}
      TENCENT_VOD_SUB_APP_ID: ${TENCENT_VOD_SUB_APP_ID:-}
    volumes:
      - ./data:/app/data
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api
